# kind cluster config enabling Ingress support (see "Running on Kubernetes" in the
# README). Maps host ports 80/443 to the control-plane node and labels it
# ingress-ready so ingress-nginx's kind-specific manifest schedules onto it.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: go-event-platform
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8090
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP

apiVersion: v1
data:
  datasources.yml: |
    apiVersion: 1

    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false

      - name: Jaeger
        type: jaeger
        access: proxy
        url: http://jaeger:16686
        editable: false
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: go-event-platform
---
apiVersion: v1
data:
  dashboards.yml: |
    apiVersion: 1

    providers:
      - name: go-event-platform
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: go-event-platform
---
apiVersion: v1
data:
  overview.json: |
    {
      "uid": "go-event-platform-overview",
      "title": "go-event-platform overview",
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": { "from": "now-15m", "to": "now" },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "HTTP request rate",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total[1m])) by (job)",
              "legendFormat": "{{job}}"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "HTTP error rate (5xx)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{status=~\"5..\"}[1m])) by (job)",
              "legendFormat": "{{job}}"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "HTTP p95 latency",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, job))",
              "legendFormat": "{{job}}"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "gRPC request rate (order-service -> inventory-service)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [
            {
              "expr": "sum(rate(grpc_server_requests_total[1m])) by (method, code)",
              "legendFormat": "{{method}} {{code}}"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Orders created rate",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 16 },
          "targets": [
            {
              "expr": "rate(orders_created_total[1m])",
              "legendFormat": "orders/sec"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Stock reservation failures",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 16 },
          "targets": [
            {
              "expr": "sum(rate(stock_reservation_failures_total[5m])) by (reason)",
              "legendFormat": "{{reason}}"
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Inventory cache hit ratio",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 16 },
          "fieldConfig": { "defaults": { "unit": "percentunit", "max": 1, "min": 0 }, "overrides": [] },
          "targets": [
            {
              "expr": "sum(rate(inventory_item_cache_result_total{result=\"hit\"}[5m])) / sum(rate(inventory_item_cache_result_total[5m]))",
              "legendFormat": "hit ratio"
            }
          ]
        }
      ]
    }
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: go-event-platform
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: go-event-platform
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: go-event-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: go-event-platform
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Admin
            - name: GF_AUTH_DISABLE_LOGIN_FORM
              value: "true"
          ports:
            - containerPort: 3000
              name: http
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: go-event-platform
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: go-event-platform
spec:
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - port: 3000
      targetPort: 3000
      name: http

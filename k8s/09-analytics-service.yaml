apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: go-event-platform
  labels:
    app.kubernetes.io/name: analytics-service
    app.kubernetes.io/part-of: go-event-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: analytics-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: analytics-service
        app.kubernetes.io/part-of: go-event-platform
    spec:
      containers:
        - name: analytics-service
          image: analytics-service:local
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8084"
            - name: NATS_URL
              value: nats://nats:4222
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: jaeger:4317
          ports:
            - containerPort: 8084
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8084
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8084
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-service
  namespace: go-event-platform
  labels:
    app.kubernetes.io/name: analytics-service
    app.kubernetes.io/part-of: go-event-platform
spec:
  selector:
    app.kubernetes.io/name: analytics-service
  ports:
    - port: 8084
      targetPort: 8084
      name: http

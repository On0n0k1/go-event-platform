apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: go-event-platform
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/part-of: go-event-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notification-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notification-service
        app.kubernetes.io/part-of: go-event-platform
    spec:
      initContainers:
        - name: wait-for-nats
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z nats 4222; do echo waiting for nats; sleep 2; done"]
      containers:
        - name: notification-service
          image: notification-service:local
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8083"
            - name: NATS_URL
              value: nats://nats:4222
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: jaeger:4317
          ports:
            - containerPort: 8083
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8083
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8083
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: go-event-platform
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/part-of: go-event-platform
spec:
  selector:
    app.kubernetes.io/name: notification-service
  ports:
    - port: 8083
      targetPort: 8083
      name: http

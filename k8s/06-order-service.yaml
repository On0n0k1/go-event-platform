apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: go-event-platform
  labels:
    app.kubernetes.io/name: order-service
    app.kubernetes.io/part-of: go-event-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: order-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-service
        app.kubernetes.io/part-of: go-event-platform
    spec:
      initContainers:
        - name: wait-for-order-db
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z order-db 5432; do echo waiting for order-db; sleep 2; done"]
        - name: wait-for-nats
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z nats 4222; do echo waiting for nats; sleep 2; done"]
      containers:
        - name: order-service
          image: order-service:local
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8082"
            - name: DATABASE_URL
              value: postgres://orders:orders@order-db:5432/orders?sslmode=disable
            - name: INVENTORY_SERVICE_GRPC_ADDR
              value: inventory-service:9081
            - name: NATS_URL
              value: nats://nats:4222
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: jaeger:4317
            - name: TLS_CERT_FILE
              value: /certs/tls.crt
            - name: TLS_KEY_FILE
              value: /certs/tls.key
            - name: TLS_CA_FILE
              value: /certs/ca.crt
          ports:
            - containerPort: 8082
              name: http
          volumeMounts:
            - name: tls
              mountPath: /certs
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: tls
          secret:
            secretName: order-service-tls
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: go-event-platform
  labels:
    app.kubernetes.io/name: order-service
    app.kubernetes.io/part-of: go-event-platform
spec:
  selector:
    app.kubernetes.io/name: order-service
  ports:
    - port: 8082
      targetPort: 8082
      name: http

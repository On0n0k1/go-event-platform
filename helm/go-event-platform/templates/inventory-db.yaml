apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: inventory-db-data
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: inventory-db
    app.kubernetes.io/part-of: go-event-platform
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-db
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: inventory-db
    app.kubernetes.io/part-of: go-event-platform
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  replicas: 1
  # A single ReadWriteOnce PVC can't be mounted by two pods at once, so avoid
  # briefly running old+new pods side by side during a rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inventory-db
        app.kubernetes.io/part-of: go-event-platform
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: inventory
            - name: POSTGRES_PASSWORD
              value: inventory
            - name: POSTGRES_DB
              value: inventory
            # A fresh PVC's root sometimes contains a lost+found dir, which
            # trips up Postgres's "is this directory empty?" initdb check.
            # Using a subdirectory as PGDATA sidesteps that entirely.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "inventory"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "inventory"]
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: inventory-db-data
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-db
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: inventory-db
    app.kubernetes.io/part-of: go-event-platform
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  selector:
    app.kubernetes.io/name: inventory-db
  ports:
    - port: 5432
      targetPort: 5432

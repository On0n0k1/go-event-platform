services:
  inventory-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
      POSTGRES_DB: inventory
    ports:
      - "55432:5432"
    volumes:
      - inventory-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory"]
      interval: 5s
      timeout: 3s
      retries: 5

  order-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
      POSTGRES_DB: orders
    ports:
      - "55433:5432"
    volumes:
      - order-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders"]
      interval: 5s
      timeout: 3s
      retries: 5

  nats:
    image: nats:2-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/varz"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:14269/"]
      interval: 5s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 5

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  certs:
    image: alpine:3.20
    volumes:
      - ./certs:/certs
    entrypoint: ["/bin/sh", "/certs/generate.sh"]

  inventory-service:
    build:
      context: ./inventory-service
    environment:
      PORT: "8081"
      GRPC_PORT: "9081"
      DATABASE_URL: postgres://inventory:inventory@inventory-db:5432/inventory?sslmode=disable
      REDIS_ADDR: redis:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
      TLS_CERT_FILE: /certs/inventory-service.crt
      TLS_KEY_FILE: /certs/inventory-service.key
      TLS_CA_FILE: /certs/ca.crt
    volumes:
      - ./certs:/certs:ro
    ports:
      - "8081:8081"
      - "9081:9081"
    depends_on:
      inventory-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_healthy
      certs:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  order-service:
    build:
      context: ./order-service
    environment:
      PORT: "8082"
      DATABASE_URL: postgres://orders:orders@order-db:5432/orders?sslmode=disable
      INVENTORY_SERVICE_GRPC_ADDR: inventory-service:9081
      NATS_URL: nats://nats:4222
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
      TLS_CERT_FILE: /certs/order-service.crt
      TLS_KEY_FILE: /certs/order-service.key
      TLS_CA_FILE: /certs/ca.crt
    volumes:
      - ./certs:/certs:ro
    ports:
      - "8082:8082"
    depends_on:
      order-db:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      nats:
        condition: service_healthy
      jaeger:
        condition: service_healthy
      certs:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  notification-service:
    build:
      context: ./notification-service
    environment:
      PORT: "8083"
      NATS_URL: nats://nats:4222
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
    ports:
      - "8083:8083"
    depends_on:
      nats:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  analytics-service:
    build:
      context: ./analytics-service
    environment:
      PORT: "8084"
      NATS_URL: nats://nats:4222
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
    ports:
      - "8084:8084"
    depends_on:
      nats:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  api-gateway:
    build:
      context: ./api-gateway
    environment:
      PORT: "8080"
      ORDER_SERVICE_URL: http://order-service:8082
      INVENTORY_SERVICE_URL: http://inventory-service:8081
      ANALYTICS_SERVICE_URL: http://analytics-service:8084
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
    ports:
      - "8080:8080"
    depends_on:
      order-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy
      jaeger:
        condition: service_healthy

volumes:
  inventory-db-data:
  order-db-data:
